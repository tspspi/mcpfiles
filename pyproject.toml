[build-system]
requires = [
    "setuptools>=42",
    "setuptools-git-versioning",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "mcpfiles"
dynamic = ["version"]
requires-python = ">= 3.11"
description = "MCP server exposing constrained filesystem workspaces"
readme = "README.md"
authors = [
    { name = "Thomas Spielauer", email = "pypipackages01@tspi.at" }
]
dependencies = [
    "fastmcp==4.0.3",
    "pydantic > 2.5.0",
    "argon2-cffi>=23.1.0"
]

[project.optional-dependencies]
remote = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.24.0"
]

[project.scripts]
mcpfiles = "mcpfiles.app.server:run_mcp_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpfiles*"]

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
addopts = [
    "--cov=mcpfiles",
    "--cov-report=term",
    "--cov-fail-under=80"
]
testpaths = [
    "tests"
]

[tool.coverage.run]
omit = [
    "mcpfiles/app/server.py"
]
